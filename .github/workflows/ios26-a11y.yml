name: ios26-a11y
defaults:
  run:
    shell: bash
jobs:
  talkback-apks:
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@v4
      with:
        ref: a6f99bdd3ba5b3c0fff8c2bf226bd8a59e7d0b0a
    - name: Tools and SDK
      run: 'set -euo pipefail

        uname -m

        export JAVA_HOME=${JAVA_HOME_17_arm64:-$JAVA_HOME}

        java -version

        echo "ANDROID_HOME=$ANDROID_HOME JAVA_HOME=$JAVA_HOME"

        brew install gnu-tar rsync python@3.12

        git config --global user.email ci@example.com

        git config --global user.name ci

        '
    - name: Install SDK components
      run: 'set -euo pipefail

        SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)

        set +o pipefail

        yes | "$SDKM" --licenses > /tmp/android-licenses.log 2>&1

        set -o pipefail

        "$SDKM" "platforms;android-36" "ndk;29.0.14206865" "cmake;3.22.1" "build-tools;36.0.0"

        ls "$ANDROID_HOME/ndk" "$ANDROID_HOME/build-tools"

        '
    - name: Prepare pinned sources and archives
      run: 'if ! ( set -e; ./dependencies/prepare.sh --product andarium-accessibility; ./dependencies/prepare.sh
        --archive-manifest dependencies/andarium-accessibility/archives.tsv ) > /tmp/a11y-prepare.log 2>&1; then
        tail -n 100 /tmp/a11y-prepare.log; exit 1; fi

        tail -n 8 /tmp/a11y-prepare.log

        df -h /

        '
    - name: Apply upstream offline TalkBack patch to exported build source
      run: 'python3 - <<''PY''

        from pathlib import Path

        import base64

        Path(''/tmp/talkback-offline.patch'').write_bytes(base64.b64decode(''''))

        p=Path(''dependencies/build-andarium-accessibility.sh'')

        s=p.read_text()

        needle = ''for source in talkback espeak-ng sonic; do''

        # Apply after each source export loop, immediately before the first SDK properties write.

        anchor = ''printf '' + chr(39) + ''sdk.dir=%s''

        assert s.count(anchor)==2

        point=s.index(anchor)

        s=s[:point]+''git -C "$WORK_ROOT/talkback" init -q\n''+''git -C "$WORK_ROOT/talkback" apply --check /tmp/talkback-offline.patch\n''+''git
        -C "$WORK_ROOT/talkback" apply /tmp/talkback-offline.patch\n''+s[point:]


        p.write_text(s)

        PY

        '
    - name: Build unsigned offline TalkBack and eSpeak NG only
      run: 'export JAVA_HOME=${JAVA_HOME_17_arm64:-$JAVA_HOME}

        if ! ./dependencies/build-andarium-accessibility.sh > /tmp/a11y-build.log 2>&1; then tail -n 140 /tmp/a11y-build.log;
        exit 1; fi

        tail -n 15 /tmp/a11y-build.log

        ls -la .build/andarium-accessibility

        cat .build/andarium-accessibility/artifact.json

        for source in talkback espeak-ng sonic; do git -C "external/sources/$source" archive --format=tar.gz HEAD
        -o "$GITHUB_WORKSPACE/.build/andarium-accessibility/$source-source.tar.gz"; done

        cp dependencies/andarium-accessibility/archives.tsv .build/andarium-accessibility/


        cp /tmp/talkback-offline.patch .build/andarium-accessibility/

        printf ''%s\n'' ''TalkBack source archive is the pinned baseline. Apply talkback-offline.patch before building
        this offline variant. APKs remain unsigned and are not installable until test signing is approved.'' > .build/andarium-accessibility/VARIANT.txt

        python3 - <<''PY''

        import json,hashlib

        from pathlib import Path

        p=Path(".build/andarium-accessibility/artifact.json")

        x=json.loads(p.read_text())

        x["talkback_additional_patch_sha256"]=hashlib.sha256(Path("/tmp/talkback-offline.patch").read_bytes()).hexdigest()

        p.write_text(json.dumps(x,indent=2)+"\n")

        PY

        '
    - uses: actions/upload-artifact@v4
      with:
        name: andarium-accessibility-OFFLINE-UNSIGNED
        path: .build/andarium-accessibility
        retention-days: 1
        if-no-files-found: error
'on':
  workflow_dispatch: null
