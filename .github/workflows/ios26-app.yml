      - name: Build tools
        run: |
          xcodebuild -version; df -h /
          brew install cmake ninja meson autoconf automake gettext libtool gperf groff pkg-config rsync python@3.12
          pip3 install --break-system-packages mako pyyaml packaging
          xcodebuild -downloadComponent MetalToolchain || true
          git config --global user.email ci@example.com; git config --global user.name ci
      - name: deps ios-network
        run: |
          if ! ( ./dependencies/prepare.sh --product ios-network && ./dependencies/build-ios-network.sh --platform ios --jobs 3 ) > /tmp/step.log 2>&1; then grep -n -B 2 -A 6 "error:" /tmp/step.log || true; tail -n 120 /tmp/step.log; exit 1; fi
          tail -n 8 /tmp/step.log; df -h /
      - name: deps ios-storage
        run: |
          if ! ( ./dependencies/prepare.sh --product ios-storage && ./dependencies/build-ios-storage.sh ) > /tmp/step.log 2>&1; then grep -n -B 2 -A 6 "error:" /tmp/step.log || true; tail -n 120 /tmp/step.log; exit 1; fi
          tail -n 8 /tmp/step.log; df -h /
      - name: deps ios-compression
        run: |
          if ! ( ./dependencies/prepare.sh --product ios-compression && ./dependencies/build-ios-zstd.sh ) > /tmp/step.log 2>&1; then grep -n -B 2 -A 6 "error:" /tmp/step.log || true; tail -n 120 /tmp/step.log; exit 1; fi
          tail -n 8 /tmp/step.log; df -h /
      - name: deps apple-gpu ios
        run: |
          if ! ( ./dependencies/prepare.sh --product apple-gpu-vulkan-experiment && ./dependencies/build-apple-gpu.sh --platform ios --jobs 3 ) > /tmp/step.log 2>&1; then grep -n -B 2 -A 6 "error:" /tmp/step.log || true; tail -n 120 /tmp/step.log; exit 1; fi
          tail -n 8 /tmp/step.log; df -h /
      - name: fetch release assets
        run: |
          if ! ( set -e; mkdir -p /tmp/rel .build/kernel/artifacts; cd /tmp/rel; curl -fsSL -O https://github.com/imxieyi/Kernarium/releases/download/1.0b15-release/android-6.18-arm64-4k-20261117-6.18.60-vd2.tar.gz -O https://github.com/imxieyi/Kernarium/releases/download/1.0b15-release/lineage24-mainline6.18-4k-20261115-los24-r28.tar.gz; ls -la; tar -tzf android-6.18-arm64-4k-20261117-6.18.60-vd2.tar.gz | head -5; tar -tzf lineage24-mainline6.18-4k-20261115-los24-r28.tar.gz | head -5; tar -xzf android-6.18-arm64-4k-20261117-6.18.60-vd2.tar.gz -C "$GITHUB_WORKSPACE/.build/kernel/artifacts"; mkdir -p rel && tar -xzf lineage24-mainline6.18-4k-20261115-los24-r28.tar.gz -C rel; ls "$GITHUB_WORKSPACE/.build/kernel/artifacts" rel ) > /tmp/step.log 2>&1; then grep -n -B 2 -A 6 "error:" /tmp/step.log || true; tail -n 120 /tmp/step.log; exit 1; fi
          tail -n 8 /tmp/step.log; df -h /
      - name: install release
        run: |
          if ! ( ls /tmp/rel/rel; python3 android/lineage-24/tools/install-release.py --source "$(ls -d /tmp/rel/rel/* | head -1)" || python3 android/lineage-24/tools/install-release.py --source /tmp/rel/rel ) > /tmp/step.log 2>&1; then grep -n -B 2 -A 6 "error:" /tmp/step.log || true; tail -n 120 /tmp/step.log; exit 1; fi
          tail -n 8 /tmp/step.log; df -h /
      - name: runtime cmake
        run: |
          if ! ( cmake --preset kernarium-ios-device-android && cmake --build --preset kernarium-ios-device-android -j3 ) > /tmp/step.log 2>&1; then grep -n -B 2 -A 6 "error:" /tmp/step.log || true; tail -n 120 /tmp/step.log; exit 1; fi
          tail -n 8 /tmp/step.log; df -h /
      - name: package frameworks and stage
        run: |
          if ! ( Kernarium/scripts/package-ios-frameworks.sh --runtimes android && Andarium/scripts/stage-system-image.py ) > /tmp/step.log 2>&1; then grep -n -B 2 -A 6 "error:" /tmp/step.log || true; tail -n 120 /tmp/step.log; exit 1; fi
          tail -n 8 /tmp/step.log; df -h /
      - name: xcodebuild unsigned
        run: |
          if ! ( xcodebuild -project Andarium/Andarium.xcodeproj -scheme Andarium -destination generic/platform=iOS -configuration Release CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= build ) > /tmp/step.log 2>&1; then grep -n -B 2 -A 6 "error:" /tmp/step.log || true; tail -n 120 /tmp/step.log; exit 1; fi
          tail -n 8 /tmp/step.log; df -h /
